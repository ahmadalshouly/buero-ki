name: Deploy backend

# Pushes the database schema, the Anthropic key and the edge functions to
# Supabase, and makes the sign-in email show the 6-digit code.
#
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   the database password of the project
#   ANTHROPIC_API_KEY      console.anthropic.com > API keys
# Optional: ANTHROPIC_WORKSPACE_ID, for keys that are not tied to a workspace.

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Supabase project ref (the part before .supabase.co)
        default: tvkpaoqnvjpjfaeqdzhr
  push:
    branches: [main]
    paths: [supabase/**]

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: ${{ inputs.project_ref || vars.SUPABASE_PROJECT_REF || 'tvkpaoqnvjpjfaeqdzhr' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD ANTHROPIC_API_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Add the repository secret $name"; missing=1; fi
          done
          exit $missing

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Database schema
        run: supabase db push --include-all

      - name: Function secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: |
          args=("ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY")
          [ -n "$ANTHROPIC_WORKSPACE_ID" ] && args+=("ANTHROPIC_WORKSPACE_ID=$ANTHROPIC_WORKSPACE_ID")
          supabase secrets set "${args[@]}" --project-ref "$PROJECT_REF"

      - name: Edge functions
        run: supabase functions deploy analyze-document draft-reply case-chat export-data delete-account --project-ref "$PROJECT_REF"

      - name: Sign-in email with code
        run: |
          body=$(jq -n '{
            mailer_subjects_magic_link: "Dein BüroKI-Code",
            mailer_templates_magic_link_content: "<h2>BüroKI</h2><p>Dein Anmeldecode / Your sign-in code:</p><p style=\"font-size:28px;font-weight:bold;letter-spacing:4px\">{{ .Token }}</p><p>Der Code ist eine Stunde gültig. / The code is valid for one hour.</p>",
            mailer_otp_length: 6
          }')
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$body" -o /dev/null
          echo "Magic link email now shows the 6-digit code."
