name: Deploy backend

# Pushes the database schema, the Lyceum AI key and the edge functions to
# Supabase, and makes the sign-in email show the 6-digit code.
#
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   the database password of the project
#   LYCEUM_API_KEY         lyceum.technology > API keys
# Optional, for reliable search results in Find help (otherwise OpenStreetMap is used):
#   GOOGLE_MAPS_API_KEY    console.cloud.google.com > APIs & Services > Credentials, with "Places API (New)" enabled
# Optional, to send emails from BüroKI (otherwise the app opens the email app):
#   RESEND_API_KEY         resend.com > API keys
#   EMAIL_FROM             a sender address on a domain verified in Resend, e.g. post@mail.example.de

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Supabase project ref (the part before .supabase.co)
        default: tvkpaoqnvjpjfaeqdzhr
  push:
    branches: [main]
    paths: [supabase/**]

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: ${{ inputs.project_ref || vars.SUPABASE_PROJECT_REF || 'tvkpaoqnvjpjfaeqdzhr' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          LYCEUM_API_KEY: ${{ secrets.LYCEUM_API_KEY }}
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD LYCEUM_API_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Add the repository secret $name"; missing=1; fi
          done
          exit $missing

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Database schema
        run: supabase db push --include-all

      - name: Function secrets
        env:
          LYCEUM_API_KEY: ${{ secrets.LYCEUM_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          args=("LYCEUM_API_KEY=$LYCEUM_API_KEY")
          [ -n "$RESEND_API_KEY" ] && args+=("RESEND_API_KEY=$RESEND_API_KEY")
          [ -n "$EMAIL_FROM" ] && args+=("EMAIL_FROM=$EMAIL_FROM")
          [ -n "$GOOGLE_MAPS_API_KEY" ] && args+=("GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY")
          [ -z "$GOOGLE_MAPS_API_KEY" ] && echo "::notice::GOOGLE_MAPS_API_KEY missing: Find help searches OpenStreetMap, which is often busy."
          if [ -z "$RESEND_API_KEY" ] || [ -z "$EMAIL_FROM" ]; then
            echo "::notice::RESEND_API_KEY or EMAIL_FROM missing: the app opens the email app instead of sending from BüroKI."
          fi
          supabase secrets set "${args[@]}" --project-ref "$PROJECT_REF"

      - name: Edge functions
        run: supabase functions deploy analyze-document draft-reply case-chat fill-form learn-facts find-help send-email export-data delete-account --project-ref "$PROJECT_REF"

      - name: Sign-in settings
        run: |
          patch() {
            code=$(curl -sS -o /tmp/auth.json -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$1")
            echo "HTTP $code"; [ "$code" -lt 300 ] || { cat /tmp/auth.json; echo; return 1; }
          }
          # The sign-in link may open the app: Expo Go (exp://) and the installed app (bueroki://).
          patch '{"uri_allow_list": "bueroki://**,exp://**,http://localhost:8081/**"}'
          # Sign-up with email and password signs people in at once, without a confirmation email.
          patch '{"mailer_autoconfirm": true, "password_min_length": 8}'
          # Also put the code in the email. Free projects on the built-in mailer can't change
          # templates; the app then signs in through the link alone.
          template='<h2>BüroKI</h2><p><a href="{{ .ConfirmationURL }}">Anmelden / Sign in</a></p><p>Code: <b style="font-size:24px;letter-spacing:4px">{{ .Token }}</b></p>'
          patch "$(jq -n --arg t "$template" '{mailer_subjects_magic_link: "Dein BüroKI-Login", mailer_templates_magic_link_content: $t, mailer_templates_confirmation_content: $t}')" \
            || echo "::notice::Email templates unchanged (needs custom SMTP on the free plan). Sign-in works through the link."
